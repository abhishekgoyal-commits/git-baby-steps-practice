services:
	db:
		image: postgres:15-alpine
		environment:
			POSTGRES_DB: jira_dashboard
			POSTGRES_USER: jira_dashboard
			POSTGRES_PASSWORD: jira_dashboard_dev
		ports:
			- "5432:5432"
		volumes:
			- postgres-data:/var/lib/postgresql/data
		healthcheck:
			test: ["CMD-SHELL", "pg_isready -U jira_dashboard -d jira_dashboard"]
			interval: 5s
			timeout: 5s
			retries: 10

	backend:
		build: ./backend
		environment:
			PORT: 3001
		ports:
			- "3001:3001"
		depends_on:
			db:
				condition: service_healthy

	frontend:
		build: ./frontend
		ports:
			- "5173:5173"
		depends_on:
			- backend

volumes:
	postgres-data:
